name: Validate Phase 1

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install science engine
        run: python -m pip install --disable-pip-version-check -r requirements-science.txt

      - name: Validate Python
        run: |
          python -m py_compile pipelines/nasa_exoplanet/fetch_system.py
          python -m py_compile pipelines/nasa_exoplanet/build_frontend_dataset.py
          python -m py_compile engine/orbital/screen.py
          python -m py_compile engine/orbital/nbody.py
          python -m py_compile pipelines/orbital/build_screen.py
          python -m py_compile pipelines/orbital/build_nbody_ensemble.py
          python -m py_compile engine/climate/latitudinal_ebm.py
          python -m py_compile pipelines/climate/build_climate_baseline.py
          python -m py_compile engine/planetary/surface_systems.py
          python -m py_compile pipelines/planetary/build_surface_baseline.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build orbital baseline
        run: python pipelines/orbital/build_screen.py

      - name: Smoke-test N-body pipeline
        run: python pipelines/orbital/build_nbody_ensemble.py --runs 2 --years 2 --samples 16

      - name: Build climate baseline
        run: python pipelines/climate/build_climate_baseline.py

      - name: Build surface systems baseline
        run: python pipelines/planetary/build_surface_baseline.py

      - name: Validate JSON
        run: |
          python -m json.tool data/catalog/systems/ltt1445.json > /dev/null
          python -m json.tool frontend/data/ltt1445.json > /dev/null
          python -m json.tool docs/data/ltt1445.json > /dev/null
          python -m json.tool frontend/data/orbital-screen.json > /dev/null
          python -m json.tool docs/data/orbital-screen.json > /dev/null
          python -m json.tool frontend/data/nbody-ensemble.json > /dev/null
          python -m json.tool docs/data/nbody-ensemble.json > /dev/null
          python -m json.tool frontend/data/climate-baseline.json > /dev/null
          python -m json.tool docs/data/climate-baseline.json > /dev/null
          python -m json.tool frontend/data/surface-baseline.json > /dev/null
          python -m json.tool docs/data/surface-baseline.json > /dev/null

      - name: Validate public app files
        run: |
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          cmp frontend/index.html docs/index.html
          cmp frontend/styles.css docs/styles.css
          cmp frontend/app.js docs/app.js
          cmp frontend/data/ltt1445.json docs/data/ltt1445.json
          cmp frontend/data/orbital-screen.json docs/data/orbital-screen.json
          cmp frontend/data/nbody-ensemble.json docs/data/nbody-ensemble.json
          cmp frontend/data/climate-baseline.json docs/data/climate-baseline.json
          cmp frontend/data/surface-baseline.json docs/data/surface-baseline.json

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check docs/app.js
