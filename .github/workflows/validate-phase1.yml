name: Validate scientific application

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install science engine
        run: python -m pip install --disable-pip-version-check -r requirements-science.txt

      - name: Validate Python
        run: |
          python -m py_compile pipelines/nasa_exoplanet/fetch_system.py
          python -m py_compile pipelines/nasa_exoplanet/build_frontend_dataset.py
          python -m py_compile engine/orbital/screen.py
          python -m py_compile engine/orbital/nbody.py
          python -m py_compile pipelines/orbital/build_screen.py
          python -m py_compile pipelines/orbital/build_nbody_ensemble.py
          python -m py_compile engine/climate/latitudinal_ebm.py
          python -m py_compile pipelines/climate/build_climate_baseline.py
          python -m py_compile engine/planetary/surface_systems.py
          python -m py_compile pipelines/planetary/build_surface_baseline.py
          python -m py_compile engine/ecology/food_web.py
          python -m py_compile pipelines/ecology/build_foodweb_baseline.py
          python -m py_compile engine/human/settlement.py
          python -m py_compile engine/human/refugia.py
          python -m py_compile pipelines/human/build_settlement_baseline.py
          python -m py_compile pipelines/human/build_refugia_baseline.py
          python -m py_compile engine/evolution/lineages.py
          python -m py_compile pipelines/evolution/build_lineage_baseline.py
          python -m py_compile engine/evolution/popgen.py
          python -m py_compile engine/evolution/admixture.py
          python -m py_compile pipelines/evolution/build_popgen_baseline.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build all public science baselines
        run: |
          python pipelines/orbital/build_screen.py
          python pipelines/orbital/build_nbody_ensemble.py --runs 2 --years 2 --samples 16
          python pipelines/climate/build_climate_baseline.py
          python pipelines/planetary/build_surface_baseline.py
          python pipelines/ecology/build_foodweb_baseline.py
          python pipelines/human/build_settlement_baseline.py
          python pipelines/human/build_refugia_baseline.py
          python pipelines/evolution/build_lineage_baseline.py
          python pipelines/evolution/build_popgen_baseline.py

      - name: Validate JSON
        run: |
          FILES=(
            data/catalog/systems/ltt1445.json
            frontend/data/ltt1445.json docs/data/ltt1445.json
            frontend/data/orbital-screen.json docs/data/orbital-screen.json
            frontend/data/nbody-ensemble.json docs/data/nbody-ensemble.json
            frontend/data/climate-baseline.json docs/data/climate-baseline.json
            frontend/data/surface-baseline.json docs/data/surface-baseline.json
            frontend/data/foodweb-baseline.json docs/data/foodweb-baseline.json
            frontend/data/settlement-baseline.json docs/data/settlement-baseline.json
            frontend/data/refugia-baseline.json docs/data/refugia-baseline.json
            frontend/data/lineage-baseline.json docs/data/lineage-baseline.json
            frontend/data/popgen-baseline.json docs/data/popgen-baseline.json
          )
          for file in "${FILES[@]}"; do
            python -m json.tool "$file" > /dev/null
          done

      - name: Validate frontend and Pages parity
        run: |
          cmp frontend/index.html docs/index.html
          cmp frontend/styles.css docs/styles.css
          cmp frontend/app.js docs/app.js
          cmp frontend/data/ltt1445.json docs/data/ltt1445.json
          cmp frontend/data/orbital-screen.json docs/data/orbital-screen.json
          cmp frontend/data/nbody-ensemble.json docs/data/nbody-ensemble.json
          cmp frontend/data/climate-baseline.json docs/data/climate-baseline.json
          cmp frontend/data/surface-baseline.json docs/data/surface-baseline.json
          cmp frontend/data/foodweb-baseline.json docs/data/foodweb-baseline.json
          cmp frontend/data/settlement-baseline.json docs/data/settlement-baseline.json
          cmp frontend/data/refugia-baseline.json docs/data/refugia-baseline.json
          cmp frontend/data/lineage-baseline.json docs/data/lineage-baseline.json
          cmp frontend/data/popgen-baseline.json docs/data/popgen-baseline.json

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check docs/app.js
