name: Refresh science data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"
  push:
    branches: ["main"]
    paths:
      - "data/catalog/systems/ltt1445.json"
      - "pipelines/nasa_exoplanet/**"
      - "engine/orbital/**"
      - "pipelines/orbital/**"
      - "engine/climate/**"
      - "pipelines/climate/**"
      - "engine/planetary/**"
      - "pipelines/planetary/**"
      - "engine/ecology/**"
      - "pipelines/ecology/**"
      - "engine/human/**"
      - "pipelines/human/**"
      - "engine/evolution/**"
      - "engine/research/**"
      - "pipelines/evolution/**"
      - "pipelines/research/**"
      - "requirements-science.txt"
      - ".github/workflows/refresh-science-data.yml"

permissions:
  contents: write

jobs:
  science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install science engine
        run: python -m pip install --disable-pip-version-check -r requirements-science.txt

      - name: Refresh official NASA dataset
        run: python pipelines/nasa_exoplanet/build_frontend_dataset.py

      - name: Build analytic orbital screen
        run: python pipelines/orbital/build_screen.py

      - name: Build pilot N-body ensemble
        run: python pipelines/orbital/build_nbody_ensemble.py --runs 12 --years 100 --samples 160

      - name: Build regional climate baseline
        run: python pipelines/climate/build_climate_baseline.py

      - name: Build surface systems baseline
        run: python pipelines/planetary/build_surface_baseline.py

      - name: Build ecological guild baseline
        run: python pipelines/ecology/build_foodweb_baseline.py

      - name: Build human settlement baseline
        run: python pipelines/human/build_settlement_baseline.py

      - name: Build refugia and migration baseline
        run: python pipelines/human/build_refugia_baseline.py

      - name: Build lineage divergence baseline
        run: python pipelines/evolution/build_lineage_baseline.py

      - name: Build population genetics baseline
        run: python pipelines/evolution/build_popgen_baseline.py

      - name: Build planetary population history baseline
        run: python pipelines/human/build_planetary_history_baseline.py

      - name: Build demographic history baseline
        run: python pipelines/human/build_demography_baseline.py

      - name: Build astroanthropology baseline
        run: python pipelines/human/build_astroanthropology_baseline.py

      - name: Build interplanetary settlement baseline
        run: python pipelines/human/build_interplanetary_baseline.py

      - name: Build dynamic interplanetary network baseline
        run: python pipelines/human/build_interplanetary_network_baseline.py

      - name: Build off-world divergence baseline
        run: python pipelines/evolution/build_offworld_divergence_baseline.py

      - name: Build evolutionary replay baseline
        run: python pipelines/evolution/build_evolutionary_replay_baseline.py

      - name: Build paired counterfactual replay baseline
        run: python pipelines/evolution/build_counterfactual_replay_baseline.py

      - name: Build research release manifest
        run: python pipelines/research/build_research_release_baseline.py

      - name: Build reproducible research note
        run: python pipelines/research/build_research_note.py

      - name: Build manuscript review gate
        run: python pipelines/research/build_manuscript_review_gate.py

      - name: Commit derived datasets if changed
        shell: bash
        run: |
          FILES=(
            frontend/data/ltt1445.json docs/data/ltt1445.json
            frontend/data/orbital-screen.json docs/data/orbital-screen.json
            frontend/data/nbody-ensemble.json docs/data/nbody-ensemble.json
            frontend/data/climate-baseline.json docs/data/climate-baseline.json
            frontend/data/surface-baseline.json docs/data/surface-baseline.json
            frontend/data/foodweb-baseline.json docs/data/foodweb-baseline.json
            frontend/data/settlement-baseline.json docs/data/settlement-baseline.json
            frontend/data/refugia-baseline.json docs/data/refugia-baseline.json
            frontend/data/lineage-baseline.json docs/data/lineage-baseline.json
            frontend/data/popgen-baseline.json docs/data/popgen-baseline.json
            frontend/data/planetary-history-baseline.json docs/data/planetary-history-baseline.json
            frontend/data/demography-baseline.json docs/data/demography-baseline.json
            frontend/data/astroanthropology-baseline.json docs/data/astroanthropology-baseline.json
            frontend/data/interplanetary-baseline.json docs/data/interplanetary-baseline.json
            frontend/data/interplanetary-network-baseline.json docs/data/interplanetary-network-baseline.json
            frontend/data/offworld-divergence-baseline.json docs/data/offworld-divergence-baseline.json
            frontend/data/evolutionary-replay-baseline.json docs/data/evolutionary-replay-baseline.json
            frontend/data/counterfactual-replay-baseline.json docs/data/counterfactual-replay-baseline.json
            frontend/data/research-release-baseline.json docs/data/research-release-baseline.json
            research/evidence/research-release-baseline.json
            frontend/data/research-note-baseline.json docs/data/research-note-baseline.json
            publications/research-notes/RN-TRISOLARIS-0001/paper.md
            publications/research-notes/RN-TRISOLARIS-0001/metadata.json
            publications/research-notes/RN-TRISOLARIS-0001/evidence.json
            publications/research-notes/RN-TRISOLARIS-0001/experiments.json
            publications/research-notes/RN-TRISOLARIS-0001/references.bib
            publications/research-notes/RN-TRISOLARIS-0001/REPRODUCE.md
            publications/research-notes/RN-TRISOLARIS-0001/summary.json
            publications/research-notes/RN-TRISOLARIS-0001/tables/outcome-frequencies.tsv
            publications/research-notes/RN-TRISOLARIS-0001/tables/counterfactual-deltas.tsv
            publications/research-notes/RN-TRISOLARIS-0001/figures/replay-outcomes.svg
            publications/research-notes/RN-TRISOLARIS-0001/figures/counterfactual-deltas.svg
            publications/research-notes/RN-TRISOLARIS-0001/review-gate.json
            frontend/data/manuscript-review-gate-baseline.json docs/data/manuscript-review-gate-baseline.json
          )
          if git diff --quiet -- "${FILES[@]}" && git ls-files --others --exclude-standard -- "${FILES[@]}" | grep -q '^$'; then
            echo "No scientific-data changes detected."
            exit 0
          fi
          git config user.name "trisolaris-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "data: refresh scientific baselines, research note and review gate"
          git push
